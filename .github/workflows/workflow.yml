name: python-deployment
run-name: ${{ github.actor }} - ${{ github.ref_name }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: 3.13
  DOCKER_IMAGE_NAME: kube2py

jobs:
  python-ci:
    name: Python-CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v7
      name: Setup python ${{ env.PYTHON_VERSION }}
      with:
        python-version: '${{ env.PYTHON_VERSION }}' 
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        pip install -r requirements.txt

    - name: Lint
      run: |
        cd ../
        flake8 . --show-source --statistics

    - name: Check Complexity
      run: |
        cd ../
        flake8 . --statistics --max-complexity=10 --exit-zero

    - name: Run unit tests with pytest
      run: |
        pytest -v --cov=. --cov-report=term-missing --cov-report=json

    - name: Upload python artifacts
      if: github.ref_name == 'main'
      uses: actions/upload-artifact@v4
      with:
        name: python-artifacts
        path: .

    - name: Upload helm artifacts
      if: github.ref_name == 'main'
      uses: actions/upload-artifact@v4
      with:
        name: helm-artifacts
        path: ${{ github.workspace }}/helm-charts

  build-image:
    name: Build and Push Image
    needs: ['python-ci']
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest 
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-artifacts
        path: .
  
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./src
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  heln-ci:
    runs-on: ubuntu-latest
    needs: ['python-ci']
    if: github.ref_name == 'main'
    name: Helm-CI

    steps:

    - uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .

    - name: Set Up Helm
      uses: azure/setup-helm@v4.2.0

    - name: Lint helm
      run: helm lint ./kube2py/

    - name: Template Helm
      run: helm template kube2py ./kube2py/ -f ./kube2py/values.yaml

    - name: Package Helm
      run: helm package ./kube2py

    - name: Upload Helm Artifact
      uses: actions/upload-artifact@v4
      with:
        name: helm-package
        path: ./*.tgz

  deploy-helm:
    name: Deploy Helm
    needs: [build-image, heln-ci]
    runs-on: ubuntu-latest
    environment: development

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: helm-package
        path: .

    - uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .

    - name: Set Up Helm
      uses: azure/setup-helm@v4.2.0

    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v4

    - uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - uses: azure/aks-set-context@v5
      with:
        resource-group: ${{ vars.AZURE_RESOURSE_GROUP }}
        cluster-name: ${{ vars.AZURE_CLUSTER_NAME }}

    - name: Deploy helm to Development
      run:  |
        helm upgrade --install kube2py --atomic --wait --timeout 3600s --debug ./kube2py-*.tgz \
          -f ./kube2py/values.yaml \
          --set mysql.configs.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
          --set mysql.configs.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
          --set mysql.configs.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
          --set kube2py.secrets.password="${{ secrets.KUBE2PY_PASSWORD }}" \
          --set kube2py.secrets.login="${{ secrets.KUBE2PY_LOGINE }}" \
          --set kube2py.secrets.DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
          --set kube2py.image.version="${{ github.sha }}"

