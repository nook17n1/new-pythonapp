name: helm-upgrade
run-name: ${{ github.actor }} - ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        descriptions: 'Environment to deploy to'
        type: string
      version:
        required: true
        type: string
      helm-values-path:
        type: string
        default: './kube2py/values.yaml
      helm-release: 
        default: kube2py
        type: string

jobs:
  deploy-helm:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: helm-package
        path: .

    - uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .

    - name: Set Up Helm
      uses: azure/setup-helm@v4.2.0

    - name: Set Up Kubectl
      uses: azure/setup-kubectl@v4

    - uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - uses: azure/aks-set-context@v5
      with:
        resource-group: ${{ vars.AZURE_RESOURSE_GROUP }}
        cluster-name: ${{ vars.AZURE_CLUSTER_NAME }}

    - name: Deploy helm to Development
      run:  |
        helm upgrade --install ${{ inputs.helm-release }} --wait --timeout 300s --debug ./kube2py-*.tgz \
          -f ${{ inputs.helm-values-path }} \
          --set mysql.configs.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
          --set mysql.configs.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
          --set mysql.configs.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
          --set kube2py.secrets.password="${{ secrets.KUBE2PY_PASSWORD }}" \
          --set kube2py.secrets.login="${{ secrets.KUBE2PY_LOGINE }}" \
          --set kube2py.secrets.DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
          --set kube2py.image.repository="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}" \
          --set kube2py.image.version="${{ github.sha }}"

    - name: Debug on failure
      if: failure()
      run: |
        kubectl get pods -A
        kubectl describe pod -n mateapp -l app.kubernetes.io/name=kube2py
        kubectl logs -n mateapp deploy/kube2py-kube2py --all-containers --tail=100
        kubectl logs -n mateapp deploy/kube2py-kube2py --previous --tail=100 || true
        kubectl get events -n mateapp --sort-by=.lastTimestamp
        kubectl get pods -n mysql
        kubectl describe pod -n mysql mysql-0
